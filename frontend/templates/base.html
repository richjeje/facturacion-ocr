<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Facturacion OCR{% endblock %}</title>
<link rel="stylesheet" href="/static/css/mistica.css">
<link rel="stylesheet" href="/static/css/header.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
{% if show_header is not defined or show_header %}
    <!-- Header (top navigation and actions) -->
    <header class="header" role="navigation" aria-label="Site header" style="position: sticky; top: 0; z-index: 1000;">
        <div class="header-left" style="display:flex; align-items:center; gap:10px;">
            <a href="/dashboard" class="btn-header" style="padding:8px 12px; border-radius:6px; text-decoration:none; color:white; background: rgba(0,0,0,0.15);">Dashboard</a>
        </div>
        <nav class="header-center" aria-label="Navegación principal" style="display:flex; gap:12px; align-items:center; justify-content:center; flex:1;">
            <a href="/negocio/emitir-factura" class="nav-link">Emitir Factura</a>
            <a href="/negocio/facturar-gastos" class="nav-link">Facturar Gastos</a>
            <a href="/negocio/mis-facturas" class="nav-link">Mis Facturas</a>
            <a href="/negocio/mis-clientes" class="nav-link">Mis Clientes</a>
        </nav>
        <div class="header-right" style="display:flex; align-items:center; gap:8px;">
            <button id="notif-btn" class="icon-btn" aria-label="Notificaciones" style="background:transparent;border:0; color:white; position:relative;">
                <i class="fas fa-bell"></i>
                <span id="notif-count" class="badge" style="display:none; position:absolute; top:-6px; right:-6px; background:#f87171; color:white; border-radius:999px; padding:2px 6px; font-size:10px;">0</span>
            </button>
            <a href="/configuracion/perfil" class="avatar-link" aria-label="Perfil" style="color:white; text-decoration:none; display:inline-flex; align-items:center; padding:6px 8px; border-radius:6px; border:1px solid rgba(255,255,255,.3);">Perfil</a>
        </div>
    </header>
{% endif %}

    <!-- Global Notifications (accessible globally) -->
    <div id="global-notifications" class="flex-col gap-2" style="position: fixed; top: 1rem; right: 1rem; width: 300px; z-index: 9999; display: none;">
        <div class="card p-2">
            <div class="flex justify-between items-center mb-2">
                <h4 style="margin: 0;">Notificaciones</h4>
                <button class="btn btn-outline" onclick="document.getElementById('global-notifications').style.display = 'none';" style="font-size: 0.8rem;">×</button>
            </div>
            <div id="not-list"></div>
        </div>
    </div>
    {% block content %}{% endblock %}
    <!-- Login/Auth logic (if not already logged in, show login page) -->
    <script>
        // Simple auth check; if no token -> redirect to login
        const token = localStorage.getItem('token');
        const currentPath = window.location.pathname;
        
        // Public paths that don't need auth
        const publicPaths = ['/','/login','/signup','/logout'];
        const needsAuth = !publicPaths.includes(currentPath);
        
        if (!token && needsAuth) {
            window.location.href = '/';
            // Early exit; won't load anything else
        }
        
        // Load notifications only if authenticated
        if (token) {
            async function fetchNotifications() {
                try {
                    const res = await fetch('/api/notifications');
                    const list = res.ok ? await res.json() : [];
                    const container = document.getElementById('not-list');
                    const currentCount = parseInt(container.dataset.count || '0');
                    
                    if (list.length > currentCount) {
                        container.innerHTML = list.slice(0, 5).map(n => {
                            const ago = Math.floor((Date.now() - new Date(n.created_at).getTime()) / 60000);
                            return `<div class="p-2 border-bottom:1px solid var(--border-dim);"><strong>${n.title}</strong><br><small style="color:var(--muted);">${n.message}</small><br><small style="color:var(--muted); opacity:0.7;">hace ${ago} min</small></div>`;
                        }).join('');
                        container.dataset.count = list.length;
                        document.getElementById('global-notifications').style.display = 'flex';
                    }
                } catch (e) {
                    console.error("Error fetching notifications", e);
                }
            }

            fetchNotifications();
            setInterval(fetchNotifications, 30000);
        }
    </script>
    <script src="/static/js/header.js"></script>
</body>
</html>
