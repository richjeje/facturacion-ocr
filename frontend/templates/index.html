<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Facturacion OCR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Facturacion OCR</h1>
        <div class="row">
            <div class="col-md-6">
                <h3>Subir Factura</h3>
                <div id="drop-zone" class="border border-primary p-4 text-center" style="min-height: 200px;">
                    Arrastra y suelta archivos aquí o <button id="file-btn" class="btn btn-primary">Seleccionar Archivo</button>
                    <input type="file" id="file-input" style="display: none;" accept=".pdf,.jpg,.jpeg,.png">
                </div>
                <div id="preview" class="mt-3"></div>
                <button id="upload-btn" class="btn btn-success mt-3" disabled>Procesar</button>
                <div id="progress" class="progress mt-3" style="display: none;">
                    <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                </div>
            </div>
            <div class="col-md-6">
                <h3>Resultados</h3>
                <div id="results"></div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileBtn = document.getElementById('file-btn');
        const uploadBtn = document.getElementById('upload-btn');
        const preview = document.getElementById('preview');
        const progressBar = document.querySelector('.progress-bar');
        const results = document.getElementById('results');

        let selectedFile = null;

        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('bg-light');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-light'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-light');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (file) {
                selectedFile = file;
                preview.innerHTML = `<p>Archivo seleccionado: ${file.name}</p><img id="img-preview" src="#" style="max-width: 200px; display: none;">`;
                uploadBtn.disabled = false;
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        document.getElementById('img-preview').src = e.target.result;
                        document.getElementById('img-preview').style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            }
        }

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            const formData = new FormData();
            formData.append('file', selectedFile);

            progressBar.parentElement.style.display = 'block';
            progressBar.style.width = '0%';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                const data = await response.json();
                results.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                progressBar.style.width = '100%';
            } catch (error) {
                results.innerHTML = `<p class="text-danger">Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
