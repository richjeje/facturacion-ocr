{% extends "base.html" %}

{% block title %}Bienvenido - Facturacion OCR{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-box">
        <div class="logo-text">FACTURACION OCR</div>
        
        <div class="card">
            <h3 class="text-center">Iniciar Sesión</h3>
            <div id="login-error" class="text-danger mb-3" style="display: none; font-size: 0.9rem;"></div>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required placeholder="tu_usuario">
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="btn btn-primary w-full mt-4">Entrar</button>
            </form>
            
            <div class="mt-4 text-center" style="font-size: 0.9rem;">
                <span class="text-muted">¿No tienes cuenta?</span> 
                <a href="/signup">Regístrate como Negocio</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errDiv = document.getElementById('login-error');
        errDiv.style.display = 'none';
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        try {
            const res = await fetch(`/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`, {
                method: 'POST'
            });
            
            const data = await res.json();
            
            if (res.ok) {
                localStorage.setItem('token', data.access_token);
                window.location.href = '/dashboard';
            } else {
                errDiv.textContent = data.detail || 'Error al iniciar sesión';
                errDiv.style.display = 'block';
            }
        } catch (error) {
            errDiv.textContent = 'Error de conexión';
            errDiv.style.display = 'block';
        }
    });
</script>
{% endblock %}
