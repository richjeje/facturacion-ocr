{% extends "base.html" %}
{% block title %}Facturar Gastos - Negocio{% endblock %}
{% block content %}
<div class="container" style="padding:2rem; max-width:1100px;">
  <h2>Facturar Gastos</h2>
  <p class="text-muted" style="margin-bottom:1rem;">Sube el ticket y el OCR extraerá los datos (mock).</p>
  <div class="card p-4" style="display:flex; flex-direction:column; gap:12px;">
    <div style="display:flex; flex-wrap:wrap; gap:12px;">
      <div style="flex:1 1 320px; min-width:280px;">
        <label>Subir Ticket</label>
        <div id="upload-zone2" class="drop-zone" style="padding:2rem; text-align:center; cursor:pointer;">
          <i class="fas fa-camera" style="font-size:2rem; color:var(--mist-purple);"></i>
          <div>Haz clic o arrastra una imagen</div>
          <input type="file" id="ticket-input2" accept="image/*" style="display:none;"/>
        </div>
      </div>
      <div style="flex:1 1 420px; min-width:360px;">
        <label>Datos extraídos</label>
        <div id="ticket-details2" class="card" style="min-height:140px; padding:12px; background:#f8f8f8;">Sin datos aún</div>
      </div>
    </div>
  </div>

  <div id="gastos-result" class="mt-3"></div>
</div>
{% endblock %}
