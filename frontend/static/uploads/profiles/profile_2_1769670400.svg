<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions for neon glow effects -->
    <linearGradient id="vGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="vGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filters for neon effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Deep black background (Vanta Black simulation) -->
  <rect width="800" height="600" fill="#0a0a0a"/>
  
  <!-- Subtle ambient glow circles in background -->
  <circle cx="400" cy="220" r="150" fill="url(#vGradient1)" opacity="0.03"/>
  <circle cx="380" cy="200" r="120" fill="#8b5cf6" opacity="0.05"/>
  
  <!-- V Symbol - Left stroke (leaning forward) -->
  <path d="M 320 160 L 380 320 L 395 320 L 335 160 Z" 
        fill="url(#vGradient1)" 
        filter="url(#strongGlow)"
        opacity="0.95">
    <animate attributeName="opacity" 
             values="0.95;1;0.95" 
             dur="3s" 
             repeatCount="indefinite"/>
  </path>
  
  <!-- V Symbol - Right stroke (leaning forward) -->
  <path d="M 465 160 L 405 320 L 420 320 L 480 160 Z" 
        fill="url(#vGradient2)" 
        filter="url(#strongGlow)"
        opacity="0.95">
    <animate attributeName="opacity" 
             values="0.95;1;0.95" 
             dur="3s" 
             repeatCount="indefinite"
             begin="0.5s"/>
  </path>
  
  <!-- Energy circuit lines - decorative tech elements -->
  <line x1="335" y1="160" x2="355" y2="160" 
        stroke="#00ffff" stroke-width="2" 
        filter="url(#glow)" opacity="0.6"/>
  <line x1="445" y1="160" x2="465" y2="160" 
        stroke="#a78bfa" stroke-width="2" 
        filter="url(#glow)" opacity="0.6"/>
  
  <!-- Small accent dots for circuit aesthetic -->
  <circle cx="355" cy="160" r="3" fill="#00ffff" filter="url(#glow)"/>
  <circle cx="445" cy="160" r="3" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="390" cy="320" r="4" fill="#06b6d4" filter="url(#strongGlow)">
    <animate attributeName="r" 
             values="4;5;4" 
             dur="2s" 
             repeatCount="indefinite"/>
  </circle>
  <circle cx="415" cy="320" r="4" fill="#8b5cf6" filter="url(#strongGlow)">
    <animate attributeName="r" 
             values="4;5;4" 
             dur="2s" 
             repeatCount="indefinite"
             begin="0.5s"/>
  </circle>
  
  <!-- Company name text -->
  <text x="400" y="390" 
        font-family="'Arial', 'Helvetica', sans-serif" 
        font-size="42" 
        font-weight="300" 
        fill="url(#textGradient)" 
        text-anchor="middle"
        letter-spacing="8"
        filter="url(#glow)">
    VANTA
  </text>
  
  <text x="400" y="430" 
        font-family="'Arial', 'Helvetica', sans-serif" 
        font-size="22" 
        font-weight="200" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="6"
        opacity="0.8">
    SOLUTIONS
  </text>
  
  <!-- Subtle underline accent -->
  <line x1="320" y1="445" x2="480" y2="445" 
        stroke="url(#vGradient1)" 
        stroke-width="1" 
        opacity="0.3"
        filter="url(#glow)"/>
</svg>