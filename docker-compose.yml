
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/facturacion
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./imagenes:/app/imagenes
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data:/app/data

  worker:
    build: .
    command: celery -A backend.worker.tasks worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/facturacion
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./imagenes:/app/imagenes
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data:/app/data

volumes:
  postgres_data:
