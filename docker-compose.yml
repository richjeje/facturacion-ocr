version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/facturacion
      SECRET_KEY: your-secret-key
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./imagenes:/app/imagenes
      - ./output:/app/output
      - ./logs:/app/logs

  worker:
    build: .
    command: celery -A tasks worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/facturacion
      SECRET_KEY: your-secret-key
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./imagenes:/app/imagenes
      - ./output:/app/output
      - ./logs:/app/logs

volumes:
  postgres_data: